[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libopenimu"
version = "1.3.4"
description = "OpenIMU - Data Analyser for Inertial Measurement Units and Actimetry Data"
authors = [
    { name = "Dominic Létourneau", email = "dominic.letourneau@usherbrooke.ca" },
    { name = "Simon Brière", email = "simon.briere@usherbrooke.ca" },
]
readme = "README.md"
license = { file = "LICENSE.TXT" }
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "sqlalchemy>=1.4.0",
    "alembic>=1.7.0",
    "pandas>=1.3.0",
    "PySide6>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/introlab/OpenIMU"
Repository = "https://github.com/introlab/OpenIMU"
Issues = "https://github.com/introlab/OpenIMU/issues"

[tool.setuptools]
packages = ["libopenimu"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
libopenimu = ["**/*.py", "**/*.ini", "**/*.mako"]
